name: Dependency Audit Diagnostic

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 22.13.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print npm audit summary
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            isDirect: value.isDirect,
            range: value.range,
            via: (value.via ?? []).map((item) => typeof item === 'string' ? item : ({
              source: item.source,
              name: item.name,
              title: item.title,
              severity: item.severity,
              range: item.range,
              url: item.url,
            })),
            effects: value.effects,
            fixAvailable: value.fixAvailable,
          }));
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities }, null, 2));
          NODE
